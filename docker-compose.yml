version: "3.9"

services:
  app:
    build: .
    container_name: secure-auth-kit-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db
    command: sh docker/entrypoint.sh

  db:
    image: postgres:16-alpine
    container_name: secure-auth-kit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secure_auth_kit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
